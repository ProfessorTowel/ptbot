<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ptbot // command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Deep charcoal-blue ground, not flat black -- a considered dark base
     with amber (the trading-floor accent this tool has always used) paired
     with a cool cyan secondary for a two-tone system instead of one hue
     doing every job. */
  --bg:#0a0d12; --bg2:#11151c; --panel:#12161e; --panel2:#171c26;
  --line:#232a37; --line-soft:#1a1f2a;
  --amb:#ffb52e; --amb-dim:#8a6a2e; --amb-glow:rgba(255,181,46,.14);
  --cy:#4fd8e8; --cy-dim:rgba(79,216,232,.16);
  --ink:#e8ecf2; --ink-dim:#8b93a3; --ink-faint:#565f70;
  --good:#3ddc84; --good-bg:rgba(61,220,132,.10);
  --bad:#ff5c6a; --bad-bg:rgba(255,92,106,.10);
  --warn:#ffc24a; --warn-bg:rgba(255,194,74,.10);
  --shadow:0 2px 4px rgba(0,0,0,.4), 0 16px 40px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:
    radial-gradient(1200px 600px at 15% -10%, rgba(255,181,46,.05), transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, rgba(79,216,232,.04), transparent 55%),
    var(--bg);
  color:var(--ink);
  font:15px/1.6 'JetBrains Mono',ui-monospace,Consolas,monospace;
  padding:30px 36px 60px;min-height:100vh}
.num{font-variant-numeric:tabular-nums}
h1{
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;
  letter-spacing:.07em;text-transform:uppercase;margin:0 0 6px;color:var(--ink);
  display:flex;align-items:center;gap:12px
}
h1:before{content:"";width:9px;height:9px;border-radius:50%;
  background:var(--good);box-shadow:0 0 0 4px var(--good-bg)}
h1 small{margin-left:auto;color:var(--ink-faint);font:500 13px 'JetBrains Mono',monospace;
  letter-spacing:.08em;text-transform:none}
.subline{color:var(--ink-faint);font-size:13px;letter-spacing:.03em;margin-bottom:26px}

/* ---- page navigation ---- */
.nav{display:flex;gap:0;margin-bottom:28px;border-bottom:1px solid var(--line-soft)}
.nav button{background:transparent;border:none;border-bottom:3px solid transparent;
  color:var(--ink-faint);font:600 13px 'Space Grotesk',sans-serif;letter-spacing:.07em;
  text-transform:uppercase;padding:12px 6px 14px;margin-right:30px;cursor:pointer;
  transition:color .15s,border-color .15s}
.nav button:hover{color:var(--ink-dim)}
.nav button.active{color:var(--amb);border-bottom-color:var(--amb)}

.lbl{font:600 12px 'Space Grotesk',sans-serif;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-dim)}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{position:relative;border:1px solid var(--line);background:
    linear-gradient(180deg,var(--panel2) 0%,var(--panel) 100%);
  border-radius:16px;padding:26px 28px 30px;box-shadow:var(--shadow)}
.card.wide{grid-column:1/-1}
.card>.lbl{margin-bottom:18px;display:flex;align-items:center;gap:10px}
.card>.lbl:after{content:"";flex:1;height:1px;background:var(--line-soft)}
.card.alert{border-color:rgba(255,92,106,.4);
  box-shadow:var(--shadow), 0 0 0 1px rgba(255,92,106,.12) inset}
table{width:100%;border-collapse:collapse}
td,th{padding:10px 14px 10px 0;text-align:left;vertical-align:baseline}
th{font:600 11.5px 'Space Grotesk',sans-serif;letter-spacing:.09em;color:var(--ink-faint);
  text-transform:uppercase;border-bottom:1px solid var(--line-soft);padding-bottom:10px}
td.n,th.n{text-align:right}
tr:not(:last-child) td{border-bottom:1px solid var(--line-soft)}
tr.dim td{color:var(--ink-faint)}
.big{font:700 44px/1.1 'Space Grotesk',sans-serif;color:var(--ink);letter-spacing:-.01em}
.big.num{font-family:'JetBrains Mono',monospace;font-weight:700}
.mid{font-size:20px;font-weight:600}
.ctx{color:var(--ink-dim)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .cy{color:var(--cy)}
.state{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:100px;
  letter-spacing:.09em;font:700 13px 'Space Grotesk',sans-serif;text-transform:uppercase}
.state:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.state.shadow{background:var(--good-bg);color:var(--good)}
.state.live{background:var(--bad-bg);color:var(--bad);
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.bar{height:9px;background:var(--line-soft);border-radius:100px;margin-top:10px;
  position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:100px;
  background:linear-gradient(90deg,var(--amb-dim),var(--amb));display:block;
  transition:width .4s ease}
.bar>i.bad{background:linear-gradient(90deg,#a02838,var(--bad))}
.bar>i.good{background:linear-gradient(90deg,#1f8a54,var(--good))}
.rule{height:1px;background:var(--line-soft);margin:18px 0}
.pill{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:3px 10px;
  font:600 11px 'Space Grotesk',sans-serif;letter-spacing:.05em;color:var(--ink-dim);
  text-transform:uppercase}
.pill.hot{border-color:rgba(255,92,106,.4);color:var(--bad);background:var(--bad-bg)}
.pill.on{border-color:rgba(61,220,132,.4);color:var(--good);background:var(--good-bg)}
.tape{max-height:360px;overflow:auto}
.tape::-webkit-scrollbar{width:10px} .tape::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.spark{display:block;width:100%;height:52px;margin-top:12px}
footer{margin-top:32px;color:var(--ink-faint);font-size:12.5px;letter-spacing:.05em;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
input[type=checkbox],input[type=radio]{accent-color:var(--amb);cursor:pointer;
  width:16px;height:16px}
button{font:600 12px 'Space Grotesk',sans-serif;letter-spacing:.04em;text-transform:uppercase;
  background:var(--panel2);color:var(--ink-dim);border:1px solid var(--line);
  border-radius:8px;padding:7px 14px;cursor:pointer}
button:hover{color:var(--ink);border-color:var(--amb-dim)}
</style></head><body>
<h1>ptbot // command station <small id="clock">&mdash;</small></h1>
<div class="subline">live futures execution &middot; MES / M2K / MNQ / MYM</div>
<nav class="nav">
  <button data-page="overview" onclick="showPage('overview')">Overview</button>
  <button data-page="risk" onclick="showPage('risk')">Risk &amp; Account</button>
  <button data-page="activity" onclick="showPage('activity')">Market &amp; Activity</button>
</nav>
<div id="page-overview" class="grid"><div class="card"><span class="lbl">loading</span></div></div>
<div id="page-risk" class="grid" hidden></div>
<div id="page-activity" class="grid" hidden></div>
<footer id="foot">&mdash;</footer>
<script>
const num=(v,d=2)=>(v===null||v===undefined||isNaN(v))?'—':Number(v).toFixed(d);
const money=(v)=>(v===null||v===undefined)?'—':(v<0?'-':'')+'$'+Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const sgn=(v)=>v>0?'good':(v<0?'bad':'ctx');
const age=(s)=>s===null?'—':(s<90?num(s,0)+'s':(s<5400?num(s/60,0)+'m':num(s/3600,1)+'h'));
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(label,inner,cls){return '<div class="card '+(cls||'')+'"><span class="lbl">'+label+'</span>'+inner+'</div>'}

// Cumulative-ticks sparkline. No library: a plain polyline over the tape,
// oldest to newest, with a zero rule so sign is readable at a glance.
function spark(vals){
  if(!vals.length)return '';
  let c=0;const pts=vals.map(v=>c+=v);
  const mn=Math.min(0,...pts),mx=Math.max(0,...pts),rng=(mx-mn)||1;
  const W=100,H=52;
  const xy=pts.map((p,i)=>[(i/(Math.max(1,pts.length-1)))*W,H-((p-mn)/rng)*H]);
  const d=xy.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');
  const z=H-((0-mn)/rng)*H;
  const last=pts[pts.length-1];
  const c1=last>=0?'#3ddc84':'#ff5c6a';
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<line x1="0" y1="'+z.toFixed(2)+'" x2="'+W+'" y2="'+z.toFixed(2)+'" stroke="rgba(139,147,163,.28)" stroke-width=".5"/>'+
    '<polyline points="'+d+'" fill="none" stroke="'+c1+'" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>';
}

// ---- page navigation. Pages are three pre-built grid containers, always
// in the DOM (so every tick's render() can keep all three current with no
// extra fetch logic) -- switching pages just toggles [hidden]. currentPage
// persists across renders so a 4s poll tick never snaps the view back to
// Overview while someone is reading the Risk or Activity page.
let currentPage='overview';
function showPage(name){
  currentPage=name;
  for(const p of ['overview','risk','activity'])
    document.getElementById('page-'+p).hidden=(p!==name);
  for(const b of document.querySelectorAll('.nav button'))
    b.classList.toggle('active',b.dataset.page===name);
}

function render(s){
  const R1=[],R2=[],R3=[];   // overview, risk & account, market & activity
  const sh=s.shadow||{}, ea=sh.engine_armed, sa=sh.scalper_armed;
  const inst=(sh.instruments)||{};

  // 1. ARMED OR SHADOW. The only irreversible fact here, so it leads and it
  //    is the loudest thing on the page once live.
  let ex='<div>'+
    '<span class="state '+(sa?'live':'shadow')+'">SCALPER '+(sa?'ARMED':'SHADOW')+'</span> '+
    '<span class="state '+(ea?'live':'shadow')+'">ENGINE '+(ea?'ARMED':'SHADOW')+'</span></div>'+
    '<div class="rule"></div>'+
    '<table><tr><td class="ctx">MNQ</td><td>zone_scalper &middot; <b>WITHDRAWN</b> &middot; no entry edge across selection, geometry, mechanism, direction or instrument</td></tr>'+
    '<tr><td class="ctx">MES M2K</td><td>nqq_live engine &middot; trim + 5th-swing trail &middot; ~2/wk each &middot; <b>TRADED</b></td></tr>'+
    '<tr><td class="ctx">MNQ MYM</td><td>streaming for measurement &middot; <b>zero contracts</b>, not traded</td></tr></table>'+
    '<div class="ctx" style="margin-top:10px">each needs ARM_ORDERS in its source <b>and</b> its marker file. '+
    'the marker is re-checked every cycle, so deleting it disarms immediately.</div>';
  R1.push(card('execution state',ex,(sa||ea)?'alert':''));

  const dp=s.deployment||{};
  const caps=dp.caps||{};
  const ceil=dp.ceiling||{};
  let dpv='<table><tr><th>traded</th><th class="n">cap now</th><th class="n">base</th><th class="n ctx">ceiling</th></tr>';
  for(const k of (dp.traded||[])){
    const below=(ceil[k]!==undefined&&caps[k]!==undefined&&caps[k]<ceil[k]);
    dpv+='<tr><td class="ctx">'+k+'</td><td class="n'+(below?' warn':'')+'">'+caps[k]+
         '</td><td class="n">'+Math.round(caps[k]*2/3)+
         '</td><td class="n ctx">'+(ceil[k]!==undefined?ceil[k]:'—')+'</td></tr>';
  }
  dpv+='</table>';
  if(dp.caps_source&&dp.caps_source.indexOf('CEILING')===0)
    dpv+='<div class="bad" style="margin-top:8px">no ramp snapshot &mdash; showing the CEILING, not what is being traded</div>';
  dpv+='<div class="ctx" style="margin-top:8px">'+esc(dp.sizing||'')+
       (dp.binding_room!==null&&dp.binding_room!==undefined
          ? ' &middot; binding room '+money(dp.binding_room) : '')+'</div>';
  dpv+='<div class="rule"></div><table>'+
    '<tr><td class="ctx">budget</td><td>'+
      Object.values(caps).reduce((a,b)=>a+b,0)+' of '+(dp.max_micros||50)+
      ' micros &mdash; this, not the feed, is the binding constraint</td></tr>'+
    '<tr><td class="ctx">streaming</td><td>'+((dp.streaming||[]).join(' ')||'?')+
      ' &middot; one socket, minute bars + quotes</td></tr>'+
    '<tr><td class="ctx">basis</td><td>projections computed on the <b>'+
      (dp.basis||'?')+'</b> population</td></tr></table>'+
    '<div class="ctx" style="margin-top:10px">the blended backtest is ~half '+
    'marketable entries that pick_zone() declines live. Projecting off it gave '+
    'a 65-day median at 1.9% failure; the passive population gives 42 days at '+
    '0.1%. Same series, same costs &mdash; only which trades are counted.</div>';
  R1.push(card('deployment &sol;&sol; basis for every figure below',dpv));

  // 2. RUNNERS. A resting price in a state file is not a broker order --
  // this card reports engine state only, see the label and the note below.
  let run='<table><tr><th>inst</th><th>proc</th><th class="n">resting</th><th class="n">position</th></tr>';
  let deadArmed=0;
  for(const sym of ['MNQ','MES','M2K','MYM']){
    const isScalp=sym==='MNQ';
    const pid=s.procs[isScalp?'scalp_MNQ':'nqq_'+sym];
    const i=inst[sym]||{};
    const armedHere=isScalp?sa:ea;
    let rest='—';
    if(i.resting){
      rest=(i.resting.dir>0?'BID ':'OFFER ')+num(i.resting.ep,2);
      // resting_state mirrors the proc column (it IS the same is-the-writer-
      // alive check, attached to the file so the two can't drift apart) --
      // STALE means the process that owns this candidate is no longer
      // running, so nothing is watching it or able to cancel it.
      if(i.resting_state==='STALE'){
        rest='<span class="pill hot">STALE</span> '+rest+' ('+Math.round(i.resting_age/3600)+'h old)';
        if(armedHere)deadArmed++;
      }
    }
    const pos=i.position?((i.position.dir>0?'LONG ':'SHORT ')+i.position.remaining+'ct @ '+num(i.position.entry,2)+(i.position.trimmed?' (trailing)':'')):'—';
    run+='<tr><td>'+sym+(isScalp?' <span class="pill">scalp</span>':'')+
      (armedHere?' <span class="pill hot">live</span>':'')+'</td>'+
      '<td class="'+(pid?'good':'bad')+'">'+(pid?pid:'down')+'</td>'+
      '<td class="n cy">'+rest+'</td><td class="n">'+pos+'</td></tr>';
  }
  run+='</table>';
  if(deadArmed)run+='<div class="bad" style="margin-top:10px">'+deadArmed+' armed instrument(s) have a resting candidate '+
    'saved by a process that is no longer running &mdash; nothing is watching that price or able to cancel it. Flatten manually if a broker order exists.</div>';
  R1.push(card('runners &sol;&sol; engine state, not broker state',run,deadArmed?'alert':''));

  // 3. RISK LEDGER.
  const r=s.risk||{};
  if(r.error){
    R2.push(card('portfolio risk &sol;&sol; shared','<div class="bad">unreadable: '+esc(r.error)+'</div><div class="ctx" style="margin-top:8px">treat as HALTED until this clears</div>','alert'));
  }else{
  const unk=(r.daily_pnl_unknown===true)||(r.daily_pnl==null);
  const used=unk?0:Math.max(0,-r.daily_pnl);
  const pct=(!unk&&r.daily_budget)?Math.min(100,100*used/r.daily_budget):0;
  let risk='<div class="lbl">room to floor</div><div class="big num '+((r.room||0)>1500?'':'bad')+'">'+money(r.room)+'</div>';
  risk+='<div class="rule"></div><div class="lbl">daily budget used</div>';
  if(unk){
    risk+='<div class="mid bad">unknown <span class="ctx">of '+money(-(r.daily_budget||0))+'</span></div>';
    risk+='<div class="ctx">broker P&amp;L unreadable &mdash; treat the budget as spent</div>';
    risk+='<div class="bar"><i class="bad" style="width:100%;opacity:.35"></i></div>';
  }else{
    risk+='<div class="mid '+sgn(r.daily_pnl)+' num">'+money(r.daily_pnl)+' <span class="ctx" style="font-weight:400">of '+money(-(r.daily_budget||0))+'</span></div>';
    risk+='<div class="bar"><i class="'+(pct>70?'bad':'')+'" style="width:'+pct.toFixed(0)+'%"></i></div>';
  }
  risk+='<div class="rule"></div><div class="ctx">open '+Object.keys(r.open||{}).length+' of '+(r.max_open||'—')+' &middot; max '+(r.max_same_side||'—')+' per side</div>';
  if(r.halted)risk+='<div class="bad" style="margin-top:8px">HALTED: '+esc(r.halted)+'</div>';
  R2.push(card('portfolio risk &sol;&sol; shared',risk,pct>70?'alert':''));
  }

  // 4. P&L -- CURRENT BOOK, recomputed from points not the trade_log.db
  // `pnl` column (which disagrees in sign with its own points on 7 of 26
  // legacy rows). trade_ledger.csv is rebuilt from broker fills for the
  // ACTIVE account only, so it cannot carry a retired account's trades --
  // that history is kept in pnl_archive, under its own clearly-labelled
  // section below, specifically so it is never mistaken for live P&L.
  const pn=s.pnl||[];
  let pnlv='';
  if(!pn.length){
    pnlv='<div class="ctx">no fills in the current book yet today</div>';
  }else{
    const tot=pn.reduce((a,r)=>a+(r.p||0),0);
    const wins=pn.reduce((a,r)=>a+(r.w||0),0), n=pn.reduce((a,r)=>a+(r.n||0),0);
    pnlv='<div class="big num '+sgn(tot)+'">'+money(tot)+'</div>';
    pnlv+='<div class="ctx">'+n+' fills &middot; '+wins+' win'+(wins===1?'':'s')+' ('+num(n?100*wins/n:0,0)+'%)</div>';
    pnlv+='<div class="rule"></div><table><tr><th>day</th><th>sym</th><th class="n">n</th><th class="n">p&amp;l</th></tr>';
    for(const row of pn.slice(0,8)){
      pnlv+='<tr><td class="ctx">'+esc(row.session)+'</td><td>'+esc(row.symbol)+'</td>'+
        '<td class="n ctx">'+row.n+'</td><td class="n '+sgn(row.p)+'">'+money(row.p)+'</td></tr>';
    }
    pnlv+='</table>';
  }
  const pa=s.pnl_archive||[];
  if(pa.length){
    const atot=pa.reduce((a,r)=>a+(r.p||0),0);
    pnlv+='<div class="rule"></div><div class="ctx">archived &middot; '+esc(s.pnl_archive_note||'')+
      ' &middot; '+money(atot)+' across '+pa.length+' session-rows, not part of the total above</div>';
  }
  R2.push(card('p&amp;l &sol;&sol; current book',pnlv));

  // 5. COPY-TRADE BOOK -- account linking and the ramp size it produces.
  // This is also the account-progress view: eval_state_account.json (the
  // old single-account "$3,000 target" ledger) stopped being written the
  // day the old bots were halted and nqq_live.py never wrote to it either
  // (see FINDINGS -- the dashboard's own "evaluation" panel used to render
  // that frozen data as if current). ramp_accounts.json IS what the live
  // engines actually read every cycle, so it is the only account view on
  // this page now -- one source, not two that can silently disagree.
  const ab=s.accounts||{};
  const arows=ab.accounts||[];
  const liveDash=(typeof window.__SNAPSHOT__==='undefined');
  let ac='';
  if(ab.error){ac='<div class="bad">accounts unreadable: '+esc(ab.error)+'</div>';}
  else if(!arows.length){ac='<div class="ctx">no snapshot yet &mdash; the engine writes ramp_accounts.json on its first balance read</div>';}
  else{
    ac='<div class="lbl">contracts in force</div><div class="big num">'+num(ab.total_contracts,0)+'</div>';
    ac+='<div class="ctx">1 per '+money(ab.per_contract)+' of room &middot; floor '+num(ab.floor_contracts,0)+' &middot; ceiling '+num(ab.ceiling_contracts,0)+'</div>';
    const sp=ab.split||{};const spl=[];for(const k in sp)spl.push(k+' '+sp[k]);
    if(spl.length)ac+='<div class="ctx">'+esc(spl.join(' &middot; '))+'</div>';
    ac+='<div class="rule"></div><table>';
    ac+='<tr><td class="ctx">account</td><td class="n ctx">balance</td><td class="n ctx">peak</td><td class="n ctx">room</td><td class="n ctx">leader</td><td class="n ctx">in book</td>'+(liveDash?'<td class="n ctx">after reset</td>':'')+'</tr>';
    for(const a of arows){
      const bind=a.binding?' <span class="warn">binding</span>':'';
      const thin=(a.room||0)<(ab.min_room_to_trade||300);
      ac+='<tr><td>'+esc(a.name||a.id)+bind+(a.leader?' <span class="good">LEADER</span>':'')+'</td>'+
          '<td class="n">'+money(a.balance)+'</td>'+
          '<td class="n ctx">'+money(a.peak)+'</td>'+
          '<td class="n '+(thin?'bad':'')+'">'+money(a.room)+'</td>'+
          '<td class="n">'+(liveDash
            ?'<input type="radio" name="ldr" data-id="'+esc(a.id)+'" '+(a.leader?'checked':'')+' onchange="setLeader(this)" title="The account that receives REAL orders. Changing this needs an engine restart.">'
            :(a.leader?'yes':''))+'</td>'+
          '<td class="n">'+(liveDash
            ?'<input type="checkbox" data-id="'+esc(a.id)+'" '+(a.enrolled?'checked':'')+' onchange="linkAcct(this)">'
            :(a.enrolled?'yes':'no'))+'</td>'+
          (liveDash?'<td class="n"><button data-id="'+esc(a.id)+'" onclick="resetPeak(this)" title="ONLY after the firm has reset this account. Clears the stored peak so the trailing floor re-baselines. On an account merely in drawdown this over-states room.">reset peak</button></td>':'')+
          '</tr>';
    }
    ac+='</table>';
    ac+='<div class="ctx" style="margin-top:10px">peak drives the trailing floor: floor = min('+money(50100)+', peak &minus; '+money(2000)+'). A reset account keeping its old peak reads NEGATIVE room and stands the whole book down &mdash; the engine auto-detects that, and "reset peak" is the manual override.</div>';
    if(ab.stale){
      ac+=ab.session_open
        ?'<div class="bad" style="margin-top:8px">snapshot '+num(ab.age_secs,0)+'s old &mdash; the engine is NOT refreshing balances during the session</div>'
