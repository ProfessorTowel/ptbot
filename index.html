<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ptbot // command</title><style>
:root{
  --bg:#000; --amb:#FFB000; --amb2:#FFD37A; --dim:rgba(255,176,0,.30);
  --dim2:rgba(255,176,0,.14); --line:rgba(255,176,0,.22);
  --panel:rgba(255,176,0,.028); --cyan:#4FD8E8;
  --good:#31E07A; --bad:#FF5C39; --warn:#FFC24A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--amb);
  font:12px/1.45 ui-monospace,"Cascadia Mono",Consolas,monospace;
  letter-spacing:.02em;padding:14px 16px 40px}
/* Faint CRT scanline over the page ground only. It sits behind every panel
   and never over a number you might act on. */
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(180deg,rgba(255,176,0,.020) 0 1px,
    transparent 1px 3px)}
#root,h1,footer{position:relative;z-index:1}
h1{font-size:12px;letter-spacing:.34em;margin:0 0 12px;color:var(--amb2);
  text-transform:uppercase;font-weight:500}
h1 small{float:right;color:var(--dim);letter-spacing:.18em;font-size:10px}
.lbl{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{position:relative;border:1px solid var(--line);background:var(--panel);
  padding:11px 13px 13px}
.card.wide{grid-column:1/-1}
.card:before,.card:after{content:"";position:absolute;width:9px;height:9px;
  border:1px solid var(--amb);opacity:.75}
.card:before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.card:after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.card>.lbl{margin-bottom:8px;display:block}
.card.alert{border-color:var(--bad);background:rgba(255,92,57,.05)}
.card.alert:before,.card.alert:after{border-color:var(--bad)}
table{width:100%;border-collapse:collapse}
td,th{padding:3px 6px 3px 0;text-align:left;vertical-align:baseline}
th{font-size:9.5px;letter-spacing:.18em;color:var(--dim);font-weight:400;
  text-transform:uppercase;border-bottom:1px solid var(--dim2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.dim td{color:var(--dim)}
.big{font-size:26px;line-height:1.1;color:var(--amb2);
  font-variant-numeric:tabular-nums}
.mid{font-size:15px;font-variant-numeric:tabular-nums}
.ctx{color:var(--dim)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.cy{color:var(--cyan)}
.state{display:inline-block;padding:4px 14px;border:1px solid currentColor;
  letter-spacing:.26em;font-size:11px;text-transform:uppercase}
.state.live{background:var(--bad);color:#000;border-color:var(--bad);
  font-weight:700}
.bar{height:5px;background:var(--dim2);margin-top:5px;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--amb);
  display:block}
.bar>i.bad{background:var(--bad)} .bar>i.good{background:var(--good)}
.rule{height:1px;background:var(--dim2);margin:9px 0}
.pill{border:1px solid var(--line);padding:1px 6px;font-size:9.5px;
  letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.pill.hot{border-color:var(--bad);color:var(--bad)}
.pill.on{border-color:var(--good);color:var(--good)}
.tape{max-height:210px;overflow:auto}
.spark{display:block;width:100%;height:34px;margin-top:6px}
footer{margin-top:16px;color:var(--dim);font-size:10px;letter-spacing:.14em}
</style></head><body>
<h1>ptbot // command station <small id="clock">—</small></h1>
<div id="root" class="grid"><div class="card"><span class="lbl">loading</span></div></div>
<footer id="foot">—</footer>
<script>
const num=(v,d=2)=>(v===null||v===undefined||isNaN(v))?'—':Number(v).toFixed(d);
const money=(v)=>(v===null||v===undefined)?'—':(v<0?'-':'')+'$'+Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const sgn=(v)=>v>0?'good':(v<0?'bad':'ctx');
const age=(s)=>s===null?'—':(s<90?num(s,0)+'s':(s<5400?num(s/60,0)+'m':num(s/3600,1)+'h'));
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(label,inner,cls){return '<div class="card '+(cls||'')+'"><span class="lbl">'+label+'</span>'+inner+'</div>'}

// Cumulative-ticks sparkline. No library: a plain polyline over the tape,
// oldest to newest, with a zero rule so sign is readable at a glance.
function spark(vals){
  if(!vals.length)return '';
  let c=0;const pts=vals.map(v=>c+=v);
  const mn=Math.min(0,...pts),mx=Math.max(0,...pts),rng=(mx-mn)||1;
  const W=100,H=34;
  const xy=pts.map((p,i)=>[(i/(Math.max(1,pts.length-1)))*W,H-((p-mn)/rng)*H]);
  const d=xy.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');
  const z=H-((0-mn)/rng)*H;
  const last=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<line x1="0" y1="'+z.toFixed(2)+'" x2="'+W+'" y2="'+z.toFixed(2)+'" stroke="rgba(255,176,0,.25)" stroke-width=".5"/>'+
    '<polyline points="'+d+'" fill="none" stroke="'+(last>=0?'#31E07A':'#FF5C39')+'" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>';
}

function render(s){
  const R=[];
  const sh=s.shadow||{}, ea=sh.engine_armed, sa=sh.scalper_armed;
  const inst=(sh.instruments)||{};

  // 1. ARMED OR SHADOW. The only irreversible fact here, so it leads and it
  //    is the loudest thing on the page once live.
  let ex='<div>'+
    '<span class="state '+(sa?'live':'good')+'">SCALPER '+(sa?'ARMED':'SHADOW')+'</span> '+
    '<span class="state '+(ea?'live':'good')+'">ENGINE '+(ea?'ARMED':'SHADOW')+'</span></div>'+
    '<div class="rule"></div>'+
    '<table><tr><td class="ctx">MNQ</td><td>zone_scalper · <b>WITHDRAWN</b> · no entry edge across selection, geometry, mechanism, direction or instrument</td></tr>'+
    '<tr><td class="ctx">MES M2K</td><td>nqq_live engine · trim + 5th-swing trail · ~2/wk each · <b>TRADED</b></td></tr>'+
    '<tr><td class="ctx">MNQ MYM</td><td>streaming for measurement · <b>zero contracts</b>, not traded</td></tr></table>'+
    '<div class="ctx" style="margin-top:6px">each needs ARM_ORDERS in its source <b>and</b> its marker file. '+
    'the marker is re-checked every cycle, so deleting it disarms immediately.</div>';
  R.push(card('execution state',ex,(sa||ea)?'alert':''));

  const dp=s.deployment||{};
  const caps=dp.caps||{};
  let dpv='<table><tr><th>traded</th><th class="n">cap</th><th class="n">base</th></tr>';
  for(const k of (dp.traded||[])){
    dpv+='<tr><td class="ctx">'+k+'</td><td class="n">'+caps[k]+
         '</td><td class="n">'+Math.round(caps[k]*2/3)+'</td></tr>';
  }
  dpv+='</table><div class="rule"></div><table>'+
    '<tr><td class="ctx">budget</td><td>'+
      Object.values(caps).reduce((a,b)=>a+b,0)+' of '+(dp.max_micros||50)+
      ' micros — this, not the feed, is the binding constraint</td></tr>'+
    '<tr><td class="ctx">streaming</td><td>'+((dp.streaming||[]).join(' ')||'?')+
      ' · one socket, minute bars + quotes</td></tr>'+
    '<tr><td class="ctx">basis</td><td>projections computed on the <b>'+
      (dp.basis||'?')+'</b> population</td></tr></table>'+
    '<div class="ctx" style="margin-top:6px">the blended backtest is ~half '+
    'marketable entries that pick_zone() declines live. Projecting off it gave '+
    'a 65-day median at 1.9% failure; the passive population gives 42 days at '+
    '0.1%. Same series, same costs — only which trades are counted.</div>';
  R.push(card('deployment // basis for every figure below',dpv));

  // 2. BELIEF vs BROKER. A resting price in a state file is not an order.
  let run='<table><tr><th>inst</th><th>proc</th><th class="n">resting</th><th class="n">position</th></tr>';
  let phantom=0;
  for(const sym of ['MNQ','MES','M2K','MYM']){
    const isScalp=sym==='MNQ';
    const pid=s.procs[isScalp?'scalp_MNQ':'nqq_'+sym];
    const i=inst[sym]||{};
    const armedHere=isScalp?sa:ea;
    let rest='—';
    if(i.resting){
      rest=(i.resting.dir>0?'BID ':'OFFER ')+num(i.resting.ep,2);
      // Armed + a saved candidate + no live order = the file is lying.
      if(armedHere && !(s.broker&&s.broker.orders)) { rest+=' <span class="pill hot">phantom?</span>'; phantom++; }
    }
    const pos=i.position?((i.position.dir>0?'LONG ':'SHORT ')+i.position.remaining+'ct @ '+num(i.position.entry,2)+(i.position.trimmed?' (trailing)':'')):'—';
    run+='<tr><td>'+sym+(isScalp?' <span class="pill">scalp</span>':'')+
      (armedHere?' <span class="pill hot">live</span>':'')+'</td>'+
      '<td class="'+(pid?'good':'bad')+'">'+(pid?pid:'down')+'</td>'+
      '<td class="n cy">'+rest+'</td><td class="n">'+pos+'</td></tr>';
  }
  run+='</table>';
  if(phantom)run+='<div class="bad" style="margin-top:6px">'+phantom+' resting price(s) with no confirmed broker order. '+
    'sync_resting only submits when the edge CHANGES, so arming mid-flight can leave a saved candidate that was never sent.</div>';
  R.push(card('runners // belief vs broker',run,phantom?'alert':''));

  // 3. THE ONE SOCKET. Four runners read these files and open none.
  //
  //    A stale file still holds a plausible price, so the page used to show
  //    four healthy-looking numbers while two symbols had been dead nine
  //    hours. State is now explicit, and a CLOSED market is called closed
  //    rather than counted as a fault -- otherwise every weekend reads as an
  //    outage and you learn to ignore the panel.
  const mdd=s.md||{}, closed=mdd._closed;
  let md='<table><tr><th>sym</th><th class="n">last</th><th class="n">age</th><th>state</th></tr>';
  let dead=0;
  for(const k in mdd){
    if(k==='_closed')continue;
    const m=mdd[k];
    const st=m.state||'?';
    if(st==='NO DATA'||st==='no file'||st==='unreadable')dead++;
    const cls=(st==='live')?'good':(st==='quiet')?'warn':(st==='closed')?'ctx':'bad';
    md+='<tr><td>'+k+'</td><td class="n">'+num(m.price,2)+'</td>'+
      '<td class="n ctx">'+age(m.age)+'</td><td class="'+cls+'">'+esc(st)+'</td></tr>';}
  md+='</table>';
  md+='<div class="ctx" style="margin-top:6px">'+
    (closed?'<b class="cy">MARKET CLOSED</b> — quiet is expected; ages will keep climbing until the reopen. '
           :'one md_writer socket serves all four. ')+
    'NO DATA means this symbol is not receiving ticks while the market is open — '+
    'usually it never subscribed, since the socket only sustains the first couple of chart subscriptions.</div>';
  R.push(card('market data // single socket',md,(!closed&&dead)?'alert':''));

  // 4. RISK LEDGER -- shared budget, the thing four independent processes
  //    would otherwise each assume they owned in full.
  const r=s.risk||{};
  const used=Math.max(0,-(r.daily_pnl||0));
  const pct=r.daily_budget?Math.min(100,100*used/r.daily_budget):0;
  let risk='<div class="lbl">room to floor</div><div class="big '+((r.room||0)>1500?'':'bad')+'">'+money(r.room)+'</div>';
  risk+='<div class="rule"></div><div class="lbl">daily budget used</div>';
  risk+='<div class="mid '+sgn(r.daily_pnl)+'">'+money(r.daily_pnl)+' <span class="ctx">of '+money(-(r.daily_budget||0))+'</span></div>';
  risk+='<div class="bar"><i class="'+(pct>70?'bad':'')+'" style="width:'+pct.toFixed(0)+'%"></i></div>';
  risk+='<div class="rule"></div><div class="ctx">open '+Object.keys(r.open||{}).length+' of '+(r.max_open||'—')+' · max '+(r.max_same_side||'—')+' per side</div>';
  if(r.halted)risk+='<div class="bad">HALTED: '+esc(r.halted)+'</div>';
  R.push(card('portfolio risk // shared',risk,pct>70?'alert':''));

  // 5. EVALUATION
  const e=s.eval||{};
  const prog=s.target?Math.max(0,Math.min(100,100*(e.profit||0)/s.target)):0;
  let ev='<div class="lbl">total profit</div><div class="big '+sgn(e.profit)+'">'+money(e.profit)+'</div>';
  ev+='<div class="bar"><i class="'+((e.profit||0)>=0?'good':'bad')+'" style="width:'+prog.toFixed(0)+'%"></i></div>';
  ev+='<div class="ctx">'+prog.toFixed(0)+'% of '+money(s.target)+' target</div><div class="rule"></div>';
  ev+='<table><tr><td class="ctx">best day</td><td class="n">'+money(e.best_day)+'</td></tr>';
  ev+='<tr><td class="ctx">consistency</td><td class="n">'+num(e.consistency_pct,1)+'% <span class="ctx">cap '+num(100*(s.consistency||0),0)+'%</span></td></tr>';
  ev+='<tr><td class="ctx">mll floor</td><td class="n">'+money(e.floor)+'</td></tr></table>';
  // The ledger is not always self-consistent. On 2026-09-09 its daily entries
  // summed to -6,226 while total_profit read +4,588, with dates stopping the
  // day both old bots were HALTED. Say so on the page rather than presenting
  // a known-wrong figure as fact.
  if(e.ledger_ok===false){
    ev+='<div class="rule"></div><div class="ctx" style="color:#e0a030">'+
        'ledger drift '+money(e.ledger_drift)+' — daily entries sum to '+
        money(e.ledger_days_sum)+', last '+(e.ledger_last_day||'?')+
        '. Figures above are unreconciled.</div>';
  }
  R.push(card('evaluation',ev));

  // 6. HALTED ON PURPOSE -- distinct from crashed. Conflating the two is how
  //    a dead bot goes unnoticed for a day.
  const hal=s.halted||{};
  let h=Object.keys(hal).length?'<table>':'<div class="ctx">nothing halted</div>';
  for(const k in hal)h+='<tr><td class="warn">'+esc(k)+'</td><td class="ctx">'+esc(hal[k])+'</td></tr>';
  if(Object.keys(hal).length)h+='</table>';
  R.push(card('halted deliberately',h));

  // 7. TAPE. Shadow and live rows share one csv, so live rows are marked and
  //    simulated rows are dimmed. Reading one as the other is the easiest
  //    mistake on this screen.
  const tp=s.tape||[];
  let tape='';
  if(!tp.length)tape='<div class="ctx">no trades recorded</div>';
  else{
    const liveN=tp.filter(t=>t.armed).length;
    tape='<div class="ctx">'+tp.length+' recent · <span class="'+(liveN?'bad':'ctx')+'">'+liveN+' live</span> · '+(tp.length-liveN)+' simulated</div>';
    tape+=spark(tp.slice().reverse().map(t=>t.ticks));
    tape+='<div class="tape"><table><tr><th>time</th><th>sym</th><th>exit</th><th class="n">ticks</th><th class="n">p&amp;l</th></tr>';
    for(const t of tp){
      tape+='<tr class="'+(t.armed?'':'dim')+'"><td>'+esc(t.ts)+'</td>'+
        '<td>'+esc(t.sym)+(t.armed?' <span class="pill hot">live</span>':'')+'</td>'+
        '<td class="ctx">'+esc(t.why)+'</td>'+
        '<td class="n '+sgn(t.ticks)+'">'+num(t.ticks,1)+'</td>'+
        '<td class="n '+sgn(t.pnl)+'">'+money(t.pnl)+'</td></tr>';
    }
    tape+='</table></div>';
  }
  R.push(card('trade tape // live vs simulated',tape,'wide'));

  document.getElementById('root').innerHTML=R.join('');
  document.getElementById('clock').textContent=s.ts;
  document.getElementById('foot').textContent=
    Object.keys(s.procs||{}).length+' processes · read-only view · '+
    ((sa||ea)?'ARMED — orders are real':'shadow — no orders');
}
async function tick(){try{const r=await fetch('/api/state');render(await r.json());}catch(e){}}
